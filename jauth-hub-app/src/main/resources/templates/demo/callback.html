<!DOCTYPE html>
<!--/* /demo 回调页：校验 state → 浏览器直连同源 /oauth2/token 手工换 token（公开客户端 PKCE）→ 存 sessionStorage */-->
<html lang="zh" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="#{jauth.demo.callback.title} + ' · jauth-hub'">回调：用授权码换令牌</title>
  <link rel="stylesheet" th:href="@{/css/jauth.css}" href="/css/jauth.css" />
  <link rel="stylesheet" th:href="@{/demo/demo.css}" href="/demo/demo.css" />
</head>
<body>
  <div class="page">
    <aside class="sidebar" th:if="${educational}">
      <section class="panel">
        <h2 th:text="#{jauth.teach.flow-title}">当前流程</h2>
        <nav th:replace="~{fragments/layout :: steps(3, 'jauth.flow.authcode.step1', 'jauth.flow.authcode.step2', 'jauth.flow.authcode.step3', 'jauth.flow.authcode.step4')}">steps</nav>
      </section>
      <section class="panel" th:replace="~{fragments/layout :: httplog}">http log</section>
    </aside>
    <main class="card demo-card">
      <p class="brand" th:text="#{jauth.brand}">jauth-hub</p>
      <h1 th:text="#{jauth.demo.callback.title}">回调：用授权码换令牌</h1>
      <details class="teach" th:if="${educational}">
        <summary th:text="#{jauth.teach.what-happened}">发生了什么</summary>
        <p th:text="#{jauth.demo.callback.teach}">回调教学说明</p>
      </details>
      <div class="alert" id="cb-error" hidden="hidden"></div>
      <table class="demo-kv" id="cb-result" hidden="hidden">
        <tbody>
          <tr><th>token_type</th><td id="cb-token-type"></td></tr>
          <tr><th>expires_in</th><td id="cb-expires-in"></td></tr>
          <tr><th>scope</th><td id="cb-scope"></td></tr>
          <tr><th>id_token</th><td id="cb-has-id-token"></td></tr>
          <tr><th>refresh_token</th><td id="cb-has-refresh-token"></td></tr>
        </tbody>
      </table>
      <div class="demo-actions">
        <a class="btn primary" id="cb-go-token" href="/demo/token" hidden="hidden" th:text="#{jauth.demo.callback.go-token}">查看令牌面板</a>
      </div>
    </main>
  </div>
  <script th:src="@{/demo/demo.js}" src="/demo/demo.js"></script>
  <script th:inline="javascript">
    (function () {
      var CFG = /*[[${demoConfig}]]*/ {};
      jauthDemo.httplog.init(/*[[#{jauth.demo.httplog}]]*/ 'HTTP 日志');

      function fail(message) {
        var box = document.getElementById('cb-error');
        box.textContent = message;
        box.hidden = false;
      }

      function showTokens(tokens) {
        document.getElementById('cb-token-type').textContent = tokens.token_type || '—';
        document.getElementById('cb-expires-in').textContent = tokens.expires_in + ' s';
        document.getElementById('cb-scope').textContent = tokens.scope || '—';
        document.getElementById('cb-has-id-token').textContent = tokens.id_token ? '有（OIDC）' : '无';
        document.getElementById('cb-has-refresh-token').textContent = tokens.refresh_token ? '有（可轮转）' : '无';
        document.getElementById('cb-result').hidden = false;
        document.getElementById('cb-go-token').hidden = false;
      }

      function run() {
        var params = new URLSearchParams(window.location.search);
        // 授权响应本身就是一次真实的浏览器导航，先记入日志再处理
        jauthDemo.httplog.entry('GET ' + window.location.pathname + '?' + summarizeQuery(params), 'ok');
        if (params.get('error')) {
          fail(params.get('error') + (params.get('error_description') ? '：' + params.get('error_description') : ''));
          return;
        }
        var code = params.get('code');
        if (!code) {
          fail('回调中没有 authorization_code');
          return;
        }
        var stored = jauthDemo.takeVerifierAndState();
        if (!stored.verifier) {
          fail(/*[[#{jauth.demo.callback.missing-verifier}]]*/ '未找到 code_verifier');
          return;
        }
        if (stored.state !== params.get('state')) {
          fail(/*[[#{jauth.demo.callback.state-mismatch}]]*/ 'state 校验失败');
          return;
        }
        jauthDemo.httplog.fetch('POST', CFG.tokenEndpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            grant_type: 'authorization_code',
            code: code,
            redirect_uri: CFG.redirectUri,
            client_id: CFG.clientId,
            code_verifier: stored.verifier
          })
        }).then(function (result) {
          if (!result.ok) {
            fail('换令牌失败 HTTP ' + result.status + '：' + result.text);
            return;
          }
          jauthDemo.saveTokens(JSON.parse(result.text));
          showTokens(JSON.parse(result.text));
        });
      }

      function summarizeQuery(params) {
        var parts = [];
        params.forEach(function (value, key) {
          parts.push(key + '=' + (key === 'code' || key === 'state' ? value.slice(0, 8) + '…' : value));
        });
        return parts.join('&');
      }

      run();
    })();
  </script>
</body>
</html>
