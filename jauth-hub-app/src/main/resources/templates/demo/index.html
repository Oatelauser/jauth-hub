<!DOCTYPE html>
<!--/* /demo 首页：说明 + 开始授权（PKCE S256：verifier/state 存 sessionStorage 后跳 /oauth2/authorize） */-->
<html lang="zh" xmlns:th="https://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="#{jauth.demo.index.title} + ' · jauth-hub'">发起授权码流程</title>
  <link rel="stylesheet" th:href="@{/css/jauth.css}" href="/css/jauth.css" />
  <link rel="stylesheet" th:href="@{/demo/demo.css}" href="/demo/demo.css" />
</head>
<body>
  <div class="page">
    <aside class="sidebar" th:if="${educational}">
      <section class="panel">
        <h2 th:text="#{jauth.teach.flow-title}">当前流程</h2>
        <nav th:replace="~{fragments/layout :: steps(1, 'jauth.flow.authcode.step1', 'jauth.flow.authcode.step2', 'jauth.flow.authcode.step3', 'jauth.flow.authcode.step4')}">steps</nav>
      </section>
      <section class="panel" th:replace="~{fragments/layout :: httplog}">http log</section>
    </aside>
    <main class="card demo-card">
      <p class="brand" th:text="#{jauth.brand}">jauth-hub</p>
      <h1 th:text="#{jauth.demo.index.title}">发起授权码流程</h1>
      <details class="teach" th:if="${educational}">
        <summary th:text="#{jauth.teach.what-happened}">发生了什么</summary>
        <p th:text="#{jauth.demo.index.teach}">PKCE 教学说明</p>
      </details>
      <p class="client-line" th:utext="#{jauth.demo.index.client-line}">将以公开客户端 demo-public 申请 scope</p>
      <div class="demo-actions">
        <button class="btn primary" id="demo-start" type="button" th:text="#{jauth.demo.index.start}">开始授权</button>
      </div>
      <p class="demo-hint" th:text="'/oauth2/authorize · PKCE S256 · state'" >/oauth2/authorize · PKCE S256 · state</p>
    </main>
  </div>
  <script th:src="@{/demo/demo.js}" src="/demo/demo.js"></script>
  <script th:inline="javascript">
    (function () {
      var CFG = /*[[${demoConfig}]]*/ {};
      jauthDemo.httplog.init(/*[[#{jauth.demo.httplog}]]*/ 'HTTP 日志');
      document.getElementById('demo-start').addEventListener('click', function () {
        var verifier = jauthDemo.randomB64Url(48);
        jauthDemo.sha256B64Url(verifier).then(function (challenge) {
          var state = jauthDemo.randomB64Url(16);
          jauthDemo.saveVerifierAndState(verifier, state);
          var url = CFG.authorizeEndpoint
            + '?response_type=code'
            + '&client_id=' + encodeURIComponent(CFG.clientId)
            + '&redirect_uri=' + encodeURIComponent(CFG.redirectUri)
            + '&scope=' + encodeURIComponent(CFG.scope)
            + '&state=' + encodeURIComponent(state)
            + '&code_challenge=' + encodeURIComponent(challenge)
            + '&code_challenge_method=S256';
          jauthDemo.httplog.entry('GET ' + url, 'req');
          window.location.href = url;
        });
      });
    })();
  </script>
</body>
</html>
