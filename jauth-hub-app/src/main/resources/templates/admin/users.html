<!DOCTYPE html>
<!--/* 用户管理页（B12，SUPERADMIN 专属）：列表(用户名/显示名/角色徽标/状态徽标/创建时间) + 建号表单 + 行内操作(JS → JSON) */-->
<html lang="zh" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('jauth.admin.users.title')}">
  <title>用户管理</title>
</head>
<body>
  <!--/* 壳层管理页补充样式（au- 前缀自成命名空间，照自助页 ss- 同款惯例） */-->
  <style>
    .au-wide { max-width: 860px; }
    .au-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .au-table th, .au-table td { border-bottom: 1px solid #dfe3ef; padding: 8px 10px; text-align: left; }
    .au-table th { color: #5a607a; font-weight: 600; }
    .au-badge { display: inline-block; margin-left: 6px; border-radius: 6px; padding: 1px 8px;
                font-size: 12px; background: #eef2fd; color: #3352a4; }
    .au-badge.superadmin { background: #eefaf0; color: #1f7a3d; }
    .au-badge.disabled { background: #fdeeee; color: #a33; }
    .au-actions button { margin-right: 8px; }
    .card h2 { margin: 20px 0 12px; font-size: 17px; }
  </style>
  <div class="page">
    <main class="card au-wide">
      <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}" />
      <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}" />
      <p class="brand" th:text="#{jauth.brand}">jauth-hub</p>
      <h1 th:text="#{jauth.admin.users.title}">用户管理</h1>
      <details class="teach" th:if="${educational}">
        <summary th:text="#{jauth.teach.what-happened}">发生了什么</summary>
        <p th:text="#{jauth.admin.users.teach}">用户管理教学说明</p>
      </details>

      <h2 th:text="#{jauth.admin.users.create-title}">新建用户</h2>
      <form class="form" id="user-create-form">
        <label class="field">
          <span th:text="#{jauth.admin.users.field-username}">用户名</span>
          <input type="text" name="username" maxlength="50" required="required" />
        </label>
        <label class="field">
          <span th:text="#{jauth.admin.users.field-password}">密码</span>
          <input type="password" name="password" required="required"
                 th:placeholder="#{jauth.admin.users.password-hint}" />
        </label>
        <label class="field">
          <span th:text="#{jauth.admin.users.field-display-name}">显示名（可选）</span>
          <input type="text" name="displayName" maxlength="100" />
        </label>
        <button class="btn primary" type="submit" th:text="#{jauth.admin.users.create-submit}">建号</button>
      </form>

      <h2 th:text="#{jauth.admin.users.list-title}">用户列表</h2>
      <table class="au-table">
        <thead>
          <tr>
            <th th:text="#{jauth.admin.users.col-username}">用户名</th>
            <th th:text="#{jauth.admin.users.col-display-name}">显示名</th>
            <th th:text="#{jauth.admin.users.col-role}">角色</th>
            <th th:text="#{jauth.admin.users.col-status}">状态</th>
            <th th:text="#{jauth.admin.users.col-created}">创建时间</th>
            <th th:text="#{jauth.admin.users.col-actions}">操作</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="user : ${users}">
            <td class="scope-name" th:text="${user.username}">alice</td>
            <td th:text="${user.displayName == null} ? '—' : ${user.displayName}">爱丽丝</td>
            <td>
              <span class="au-badge"
                    th:classappend="${user.role == 'SUPERADMIN'} ? superadmin"
                    th:text="${user.role == 'SUPERADMIN'} ? #{jauth.admin.users.role-superadmin} : #{jauth.admin.users.role-user}">用户</span>
            </td>
            <td>
              <span class="au-badge"
                    th:classappend="${user.status == 'DISABLED'} ? disabled"
                    th:text="${user.status == 'ACTIVE'} ? #{jauth.admin.users.status-active} : #{jauth.admin.users.status-disabled}">启用</span>
            </td>
            <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">2026-09-30 10:00</td>
            <td class="au-actions">
              <!--/* 自操作由服务端 A0513 拒，页面不预判操作者身份（渲染逻辑零特例） */-->
              <button type="button" class="btn act-role" th:attr="data-id=${user.id}"
                      th:text="#{jauth.admin.users.action-toggle-role}">改角色</button>
              <button type="button" class="btn act-status" th:attr="data-id=${user.id}"
                      th:text="#{jauth.admin.users.action-toggle-status}">停用/启用</button>
              <button type="button" class="btn act-password" th:attr="data-id=${user.id}"
                      th:text="#{jauth.admin.users.action-reset-password}">重置密码</button>
            </td>
          </tr>
        </tbody>
      </table>
    </main>
  </div>
  <script th:inline="javascript">
    (function () {
      var csrfMeta = document.querySelector('meta[name="_csrf"]');
      var csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
      function postJson(url, body) {
        var headers = { 'Content-Type': 'application/json' };
        if (csrfMeta && csrfHeaderMeta) { headers[csrfHeaderMeta.content] = csrfMeta.content; }
        return fetch(url, { method: 'POST', headers: headers, credentials: 'same-origin',
                            body: JSON.stringify(body) })
          .then(function (response) { return response.json(); });
      }
      function fail(body) {
        /* A0515 = sudo 强验证过期（v1.2 C3）：跳验证页，returnTo 带回本页重交 */
        if (body.code === 'A0515') {
          window.location.href = /*[[@{/selfservice/sudo}]]*/ '/selfservice/sudo'
              + '?returnTo=' + encodeURIComponent(location.pathname);
          return;
        }
        window.alert(body.message || body.code);
      }
      var form = document.getElementById('user-create-form');
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        postJson(/*[[ @{/api/admin/users} ]]*/ '/api/admin/users', {
            username: form.querySelector('input[name="username"]').value.trim(),
            password: form.querySelector('input[name="password"]').value,
            displayName: form.querySelector('input[name="displayName"]').value.trim()
          })
          .then(function (body) {
            if (body.code !== '00000') { fail(body); return; }
            window.location.reload();
          });
      });
      document.querySelectorAll('.act-role').forEach(function (button) {
        button.addEventListener('click', function () {
          postJson('/api/admin/users/' + button.dataset.id + '/role', {})
            .then(function (body) { body.code === '00000' ? window.location.reload() : fail(body); });
        });
      });
      document.querySelectorAll('.act-status').forEach(function (button) {
        button.addEventListener('click', function () {
          postJson('/api/admin/users/' + button.dataset.id + '/status', {})
            .then(function (body) { body.code === '00000' ? window.location.reload() : fail(body); });
        });
      });
      document.querySelectorAll('.act-password').forEach(function (button) {
        button.addEventListener('click', function () {
          var password = window.prompt(/*[[#{jauth.admin.users.reset-prompt}]]*/ '输入新密码（≥8 位）');
          if (!password) { return; }
          postJson('/api/admin/users/' + button.dataset.id + '/password', { password: password })
            .then(function (body) {
              if (body.code !== '00000') { fail(body); return; }
              window.alert(/*[[#{jauth.admin.users.reset-done}]]*/ '密码已重置');
            });
        });
      });
    })();
  </script>
</body>
</html>
