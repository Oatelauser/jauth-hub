# English skeleton: keys kept in sync with messages.properties, short placeholder values (SPEC: zh primary, en skeleton)

jauth.demo.title=/demo teaching zone

jauth.demo.index.title=Start the authorization code flow
jauth.demo.index.teach=On start, this page generates a PKCE code_verifier and a random state into sessionStorage, derives the S256 code_challenge, then redirects to /oauth2/authorize with client_id and redirect_uri. A public client has no secret; PKCE is the guard.
jauth.demo.index.steps=Flow navigation
jauth.demo.index.start=Start authorization
jauth.demo.index.client-line=Will request scope openid profile as public client <strong>demo-public</strong> (PKCE enforced)

jauth.demo.callback.title=Callback: exchange the code for tokens
jauth.demo.callback.teach=The hub redirected back with a one-time authorization code. The script validates state, takes code_verifier from sessionStorage and exchanges it browser-side at /oauth2/token — legal for a public client with PKCE. Codes expire in 5 minutes and are single-use.
jauth.demo.callback.success=Tokens obtained
jauth.demo.callback.state-mismatch=State mismatch: aborted the exchange
jauth.demo.callback.missing-verifier=code_verifier not found; restart from the index page
jauth.demo.callback.error-title=Authorization failed
jauth.demo.callback.go-token=Open the token panel

jauth.demo.token.title=Token panel
jauth.demo.token.teach=Tokens issued here are opaque: there is no payload to decode. To learn who is behind a token, hand it to /oauth2/introspect. In production this happens inside the resource server backend (as /api/demo/whoami does); this page calls it directly with the confidential client credentials only to show the raw exchange.
jauth.demo.token.access-label=Access token (opaque)
jauth.demo.token.reveal=Show / hide
jauth.demo.token.expires-label=Time remaining
jauth.demo.token.expired=Expired (re-authorize for a new token)
jauth.demo.token.no-token=No token in sessionStorage; complete authorization first
jauth.demo.token.restart=Restart authorization
jauth.demo.token.introspect-title=Introspection result
jauth.demo.token.introspect-submit=Introspect this token
jauth.demo.token.go-api=Call the protected API with the token

jauth.demo.api.title=Call a protected API with the token
jauth.demo.api.teach=The closing loop: the browser calls /api/demo/whoami with Authorization: Bearer. The endpoint is wired as a resource server via rs-starter — it introspects the token and answers with the principal. Without a token you get 401.
jauth.demo.api.call=Call /api/demo/whoami with the token
jauth.demo.api.call-bare=Call without a token (expect 401)
jauth.demo.api.response-title=Response
jauth.demo.api.need-token=No token available; complete authorization first

jauth.demo.httplog=HTTP log
jauth.demo.httplog-empty=(waiting for the first request)

jauth.admin.summary.note=Visible to SUPER_ADMIN only (@RequiresRole wiring sample)
