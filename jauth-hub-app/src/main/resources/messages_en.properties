# Profile (B12)
jauth.profile.title=Profile
jauth.profile.teach=Renaming updates only jauth_user.display_name (an empty value clears it and the UI falls back to the username). Changing the password requires the old one: failures share the login brute-force counter, and once the login lock threshold is reached this form locks too; the new password must be at least 8 characters and only the bcrypt hash is stored. Existing sessions and issued tokens survive a password change.
