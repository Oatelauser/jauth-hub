# jauth-hub-app 壳层文案（中文为主填，SPEC §1：UI 中文 + i18n 资源结构）。
# 本文件即 basename=messages 的默认（中文）包；messages_en 为英文骨架。经 starter 的复合 messageSource
# 并入 core 文案之后（jauth.* 键名分层：core 已占 jauth.brand/teach/flow/login/consent/device/pat/apps，
# 壳层一律 jauth.demo.*/jauth.admin.*，不冲突）。

jauth.demo.title=/demo 教学区

# 首页（发起授权）
jauth.demo.index.title=发起授权码流程
jauth.demo.index.teach=点击"开始授权"后，本页脚本会生成 PKCE 的 code_verifier 与随机 state 存入 sessionStorage，再用 SHA-256 算出 code_challenge（S256），携带 client_id 与 redirect_uri 跳转认证中心的 /oauth2/authorize。公开客户端没有 secret，全程靠 PKCE 防授权码被截走。
jauth.demo.index.steps=流程导航
jauth.demo.index.start=开始授权
jauth.demo.index.client-line=将以公开客户端 <strong>demo-public</strong>（强制 PKCE）申请 scope：openid profile

# 回调页（code→token 交换）
jauth.demo.callback.title=回调：用授权码换令牌
jauth.demo.callback.teach=认证中心把浏览器重定向回本页并带上一次性授权码。页面脚本先校验 state（防 CSRF），再从 sessionStorage 取出 code_verifier，由浏览器直接向同源 /oauth2/token 发起交换——公开客户端没有后端，这一步合法且必须携带 PKCE 验证因子。授权码 5 分钟有效且一次性。
jauth.demo.callback.success=令牌获取成功
jauth.demo.callback.state-mismatch=state 校验失败：回调参数与发起时不一致，可能是会话串号或注入，已中止交换
jauth.demo.callback.missing-verifier=未找到 code_verifier，请回首页重新发起授权
jauth.demo.callback.error-title=授权失败
jauth.demo.callback.go-token=查看令牌面板

# 令牌面板
jauth.demo.token.title=令牌面板
jauth.demo.token.teach=本服务签发的是 opaque 令牌——它是不透明随机串，客户端无法像 JWT 那样本地解码 payload。想知道"令牌背后是谁、有哪些 scope"，正确姿势是把它交给内省端点（/oauth2/introspect）：认证中心查库返回 active/sub/username/scope。生产环境中这一步在资源服务器后端完成（正是 /api/demo/whoami 的做法），本页由脚本携带机密客户端凭证直连，只为让你看见原始报文。
jauth.demo.token.access-label=访问令牌（opaque）
jauth.demo.token.reveal=显示 / 隐藏
jauth.demo.token.expires-label=剩余有效期
jauth.demo.token.expired=已过期（重新授权获取新令牌）
jauth.demo.token.no-token=sessionStorage 中没有令牌，请先完成授权
jauth.demo.token.restart=重新发起授权
jauth.demo.token.introspect-title=内省结果
jauth.demo.token.introspect-submit=内省此令牌
jauth.demo.token.go-api=持令牌调用受保护接口

# API 调用页
jauth.demo.api.title=持令牌调用受保护接口
jauth.demo.api.teach=右侧最后一格的闭环：浏览器携带 Authorization: Bearer 访问 /api/demo/whoami。该接口由本应用以 rs-starter 接成资源服务器——它拿令牌去内省端点换回主体与权限，再把结果作为响应返回。不带令牌调用会得到 401，这就是"资源服务器视角"的全部秘密。
jauth.demo.api.call=带令牌调用 /api/demo/whoami
jauth.demo.api.call-bare=不带令牌调用（预期 401）
jauth.demo.api.response-title=响应
jauth.demo.api.need-token=没有可用令牌，请先完成授权

# 教学区共用
jauth.demo.httplog=HTTP 日志
jauth.demo.httplog-empty=（等待首个请求）

# 管理样例端点
jauth.admin.summary.note=仅 SUPER_ADMIN 可见（@RequiresRole 接线样例）
