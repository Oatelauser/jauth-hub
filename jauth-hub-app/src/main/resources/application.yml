# jauth-hub-app 公共配置（与环境无关）。环境差异项——数据源、issuer、超管种子、/demo 教学
# 客户端、rs 内省凭证——在 application-{local,dev,prod}.yml；默认激活 local（本机开发档），
# 部署时以 --spring.profiles.active=dev|prod（或环境变量 SPRING_PROFILES_ACTIVE）覆盖。
# 敏感项写法约定（08 票）：local/dev 允许明文占位值；生产一律 ENC() 密文（生成方式见 application-prod.yml 头注）。
spring:
  application:
    name: jauth-hub-app
  profiles:
    active: local
  messages:
    # 勿回退系统 locale：fallbackToSystemLocale 默认 true 会把 JVM 默认 locale 插进 ResourceBundle
    # 候选链（排在根 bundle 之前）——en 服务器上中文浏览器会被 messages_en 劫持、中文 UI 永不可达。
    # 关掉后：zh 请求落根 bundle（中文，UI 主语言），en 请求落 messages_en 骨架，与产品语义一致
    fallback-to-system-locale: false
  session:
    jdbc:
      # spring_session 表由 jauth 私有 Flyway V3 迁移建立（vendored DDL），Spring Session 侧不再自建
      initialize-schema: never

server:
  port: 8080

# actuator（SPEC §8）：health/info/metrics 暴露；访问控制在 default 链（health/info 公开探活，
# metrics 走认证——指标含内部结构信息，不匿名开放）
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

jauth-hub:
  storage: jdbc
