# jauth-hub 页面与 scope 目录中文文案（主填，SPEC §1：UI 中文单语 + i18n 资源结构）

jauth.brand=jauth-hub

# 教学层（SPEC §7 三层教学）
jauth.teach.what-happened=发生了什么
jauth.teach.flow-title=当前流程
jauth.teach.httplog-title=HTTP 日志（预留）
jauth.teach.httplog-placeholder=/demo 教学区将在此展示实时 HTTP 请求与响应（B6 接入）

# 授权码流程步骤（登录/consent 页共用流程图）
jauth.flow.authcode.step1=应用发起授权，跳转登录
jauth.flow.authcode.step2=用户授权确认
jauth.flow.authcode.step3=回调用授权码换取令牌
jauth.flow.authcode.step4=持令牌访问资源

# 设备流程步骤（设备验证页流程图）
jauth.flow.device.step1=设备向认证中心申请用户码
jauth.flow.device.step2=用户在本页输入用户码验证
jauth.flow.device.step3=设备轮询换取令牌
jauth.flow.device.step4=持令牌访问资源

# 登录页
jauth.login.title=登录
jauth.login.username=用户名
jauth.login.password=密码
jauth.login.submit=登 录
jauth.login.error=用户名或密码错误，请重试
jauth.login.teach=你提交的用户名和密码经表单认证校验，通过后服务器建立会话（session）；auth_time（认证时间）在此刻产生，后续签发的 ID 令牌都以它作为你最近一次登录的依据。

# Consent 页
jauth.consent.title=授权确认
jauth.consent.client-label=应用
jauth.consent.requested=该应用请求获得以下权限：
jauth.consent.authorize=同意授权
jauth.consent.deny=拒绝
jauth.consent.teach=这是授权码流程的第二步：应用请求的权限（scope）与你在下方勾选的项取交集，只有交集内的权限才会写进最终发放的令牌。

# 设备验证页
jauth.device.title=设备验证
jauth.device.code-label=用户码
jauth.device.submit=验证
jauth.device.hint=请输入设备屏幕上显示的用户码（形如 BTVJ-HDQK）
jauth.device.teach=设备授权流程的用户确认端：你在设备屏幕上看到的用户码在此输入确认，设备端随后凭轮询拿到令牌，全程接触不到你的密码。

# scope 目录（jauth.scope.<name>，与 ScopeDefinition 工厂前缀一致）
jauth.scope.openid=确认你的身份标识（openid）
jauth.scope.profile=读取你的基本资料（如用户名）
jauth.scope.email=读取你的邮箱地址
