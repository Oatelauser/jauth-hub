<!DOCTYPE html>
<!--/* 三页共用 layout fragment（SPEC §7）：head 装配、流程图步骤条、HTTP 日志占位；无 JS、无外链 */-->
<html lang="zh" xmlns:th="https://www.thymeleaf.org">
<head th:fragment="head(titleKey)">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="#{${titleKey}} + ' · jauth-hub'">jauth-hub</title>
  <link rel="stylesheet" th:href="@{/css/jauth.css}" href="/css/jauth.css" />
</head>
<body>
  <!--/* 纯 CSS 步骤条：active 为 1 基序号，高亮当前步；s1..sN 为 i18n key */-->
  <nav class="steps" th:fragment="steps(active, s1, s2, s3, s4)" th:aria-label="#{jauth.teach.flow-title}">
    <ol>
      <li th:classappend="${active == 1} ? active" th:text="#{${s1}}">step one</li>
      <li th:classappend="${active == 2} ? active" th:text="#{${s2}}">step two</li>
      <li th:classappend="${active == 3} ? active" th:text="#{${s3}}">step three</li>
      <li th:classappend="${active == 4} ? active" th:text="#{${s4}}">step four</li>
    </ol>
  </nav>
  <!--/* HTTP 日志位：仅占位，B6 /demo 教学区接入实时请求/响应 */-->
  <section class="httplog" th:fragment="httplog">
    <h2 th:text="#{jauth.teach.httplog-title}">HTTP log</h2>
    <p class="placeholder" th:text="#{jauth.teach.httplog-placeholder}">reserved</p>
  </section>
</body>
</html>
