<!DOCTYPE html>
<html lang="zh" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('jauth.login.title')}">
  <title>登录</title>
</head>
<body>
  <div class="page">
    <aside class="sidebar" th:if="${educational}">
      <section class="panel">
        <h2 th:text="#{jauth.teach.flow-title}">当前流程</h2>
        <nav th:replace="~{fragments/layout :: steps(1, 'jauth.flow.authcode.step1', 'jauth.flow.authcode.step2', 'jauth.flow.authcode.step3', 'jauth.flow.authcode.step4')}">steps</nav>
      </section>
      <section class="panel" th:replace="~{fragments/layout :: httplog}">http log</section>
    </aside>
    <main class="card">
      <p class="brand" th:text="#{jauth.brand}">jauth-hub</p>
      <h1 th:text="#{jauth.login.title}">登录</h1>
      <p class="alert" th:if="${param.error}" th:text="#{jauth.login.error}">用户名或密码错误</p>
      <details class="teach" th:if="${educational}">
        <summary th:text="#{jauth.teach.what-happened}">发生了什么</summary>
        <p th:text="#{jauth.login.teach}">教学说明</p>
      </details>
      <form class="form" th:action="@{/login}" method="post">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <label class="field">
          <span th:text="#{jauth.login.username}">用户名</span>
          <input type="text" name="username" autocomplete="username" required />
        </label>
        <label class="field">
          <span th:text="#{jauth.login.password}">密码</span>
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <button class="btn primary" type="submit" th:text="#{jauth.login.submit}">登 录</button>
      </form>
    </main>
  </div>
</body>
</html>
