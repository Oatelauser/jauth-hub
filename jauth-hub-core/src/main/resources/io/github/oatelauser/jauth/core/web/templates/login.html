<!DOCTYPE html>
<html lang="zh" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('jauth.login.title')}">
  <title>登录</title>
</head>
<body>
  <div class="page">
    <aside class="sidebar" th:if="${educational}">
      <section class="panel">
        <h2 th:text="#{jauth.teach.flow-title}">当前流程</h2>
        <nav th:replace="~{fragments/layout :: steps(1, 'jauth.flow.authcode.step1', 'jauth.flow.authcode.step2', 'jauth.flow.authcode.step3', 'jauth.flow.authcode.step4')}">steps</nav>
      </section>
      <section class="panel" th:replace="~{fragments/layout :: httplog}">http log</section>
    </aside>
    <main class="card">
      <p class="brand" th:text="#{jauth.brand}">jauth-hub</p>
      <h1 th:text="#{jauth.login.title}">登录</h1>
      <p class="alert" th:if="${param.error}" th:text="#{jauth.login.error}">用户名或密码错误</p>
      <details class="teach" th:if="${educational}">
        <summary th:text="#{jauth.teach.what-happened}">发生了什么</summary>
        <p th:text="#{jauth.login.teach}">教学说明</p>
        <p th:if="${passkeyEnabled}" th:text="#{jauth.login.passkey.teach}">通行密钥教学说明</p>
      </details>
      <form class="form" th:action="@{/login}" method="post">
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <label class="field">
          <span th:text="#{jauth.login.username}">用户名</span>
          <input type="text" name="username" autocomplete="username" required />
        </label>
        <label class="field">
          <span th:text="#{jauth.login.password}">密码</span>
          <input type="password" name="password" autocomplete="current-password" required />
        </label>
        <button class="btn primary" type="submit" th:text="#{jauth.login.submit}">登 录</button>
      </form>
      <!--/* passkey 入口（v1.2 C2）：仅在 jauth-hub.passkey.enabled=true 时渲染——按钮/脚本/样式整块缺席，默认关零可见变化 */-->
      <th:block th:if="${passkeyEnabled}">
        <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}" />
        <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}" />
        <style>
          .pk-divider { border: 0; border-top: 1px solid #dfe3ef; margin: 18px 0 14px; }
        </style>
        <hr class="pk-divider" />
        <button class="btn" type="button" id="passkey-login" th:text="#{jauth.login.passkey.button}">使用通行密钥登录</button>
        <p class="alert" id="passkey-error" hidden="hidden" role="alert" th:text="#{jauth.login.passkey.error}">通行密钥验证未通过，请重试</p>
      </th:block>
    </main>
  </div>
  <script th:if="${passkeyEnabled}" th:inline="javascript">
    (function () {
      var csrfMeta = document.querySelector('meta[name="_csrf"]');
      var csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
      function postHeaders() {
        var headers = { 'Content-Type': 'application/json' };
        if (csrfMeta && csrfHeaderMeta) { headers[csrfHeaderMeta.content] = csrfMeta.content; }
        return headers;
      }
      /* base64url（无 padding，对齐 SS7 Bytes 序列化）↔ ArrayBuffer：WebAuthn 二进制字段的 JSON 线格式 */
      function toArrayBuffer(value) {
        var binary = window.atob(value.replace(/-/g, '+').replace(/_/g, '/'));
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); }
        return bytes.buffer;
      }
      function toBase64Url(buffer) {
        var bytes = new Uint8Array(buffer);
        var binary = '';
        for (var i = 0; i < bytes.length; i++) { binary += String.fromCharCode(bytes[i]); }
        return window.btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }
      var errorBox = document.getElementById('passkey-error');
      function showError() { errorBox.hidden = false; }
      /* 选项端点把 challenge 存进 session，/login/webauthn 断言回传时按 session 配对——每次尝试都取新 options */
      function requestOptions() {
        return fetch(/*[[ @{/webauthn/authenticate/options} ]]*/ '/webauthn/authenticate/options',
            { method: 'POST', headers: postHeaders(), credentials: 'same-origin' })
          .then(function (response) {
            if (!response.ok) { throw new Error('options ' + response.status); }
            return response.json();
          });
      }
      function assertWithAuthenticator(options) {
        var publicKey = {
          challenge: toArrayBuffer(options.challenge),
          rpId: options.rpId,
          timeout: options.timeout,
          userVerification: options.userVerification,
          allowCredentials: (options.allowCredentials || []).map(function (descriptor) {
            return { type: descriptor.type, id: toArrayBuffer(descriptor.id) };
          })
        };
        return navigator.credentials.get({ publicKey: publicKey });
      }
      function postAssertion(credential) {
        return fetch(/*[[ @{/login/webauthn} ]]*/ '/login/webauthn',
            { method: 'POST', headers: postHeaders(), credentials: 'same-origin',
              body: JSON.stringify({
                id: credential.id,
                rawId: toBase64Url(credential.rawId),
                type: credential.type,
                response: {
                  clientDataJSON: toBase64Url(credential.response.clientDataJSON),
                  authenticatorData: toBase64Url(credential.response.authenticatorData),
                  signature: toBase64Url(credential.response.signature),
                  userHandle: credential.response.userHandle ? toBase64Url(credential.response.userHandle) : null
                },
                clientExtensionResults: {},
                authenticatorAttachment: credential.authenticatorAttachment
              }) })
          .then(function (response) {
            if (!response.ok) { throw new Error('login ' + response.status); }
            return response.json();
          });
      }
      document.getElementById('passkey-login').addEventListener('click', function () {
        errorBox.hidden = true;
        if (!window.PublicKeyCredential) { errorBox.textContent = /*[[#{jauth.login.passkey.unsupported}]]*/ '当前浏览器不支持通行密钥'; showError(); return; }
        /* 任一步失败（含凭据已删致旧 options 的 allowCredentials 失效）→ 提示；重点重走取新 options 全流程 */
        requestOptions()
          .then(assertWithAuthenticator)
          .then(postAssertion)
          .then(function (body) { window.location.href = body.redirectUrl || '/'; })
          .catch(showError);
      });
    })();
  </script>
</body>
</html>
