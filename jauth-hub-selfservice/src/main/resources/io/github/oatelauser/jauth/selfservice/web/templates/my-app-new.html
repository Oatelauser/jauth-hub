<!DOCTYPE html>
<!--/* 注册新应用表单页（B10）:最小三件(名称/redirect URIs 多行/类型) ;提交走 JS → JSON,机密 secret 仅此一次横幅 */-->
<html lang="zh" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('jauth.myapps.new-title')}">
  <title>注册新应用</title>
</head>
<body>
  <!--/* 自助页补充样式（ss- 前缀）：textarea 照 core .field input 的观感就地补齐（core CSS 不含 textarea） */-->
  <style>
    .ss-wide { max-width: 760px; }
    .ss-token-banner code { display: block; margin-top: 6px; word-break: break-all;
                            font-family: ui-monospace, Consolas, monospace; font-size: 14px; }
    .field textarea { border: 1px solid #dfe3ef; border-radius: 8px; padding: 10px 12px; font-size: 15px;
                      font-family: ui-monospace, Consolas, monospace; min-height: 96px; }
    .field select { border: 1px solid #dfe3ef; border-radius: 8px; padding: 10px 12px; font-size: 15px; }
  </style>
  <div class="page">
    <main class="card ss-wide">
      <p class="brand" th:text="#{jauth.brand}">jauth-hub</p>
      <h1 th:text="#{jauth.myapps.new-title}">注册新应用</h1>
      <details class="teach" th:if="${educational}">
        <summary th:text="#{jauth.teach.what-happened}">发生了什么</summary>
        <p th:text="#{jauth.myapps.teach}">我的应用教学说明</p>
      </details>

      <div class="alert" th:if="${!appsSupported}" th:text="#{jauth.myapps.unsupported}">当前装配不支持</div>

      <th:block th:if="${appsSupported}">
        <!--/* secret 唯一出现位：注册成功后由脚本填入，刷新即失（对齐 PAT 展示惯例） */-->
        <div class="alert ss-token-banner" id="secret-banner" hidden="hidden">
          <p th:text="#{jauth.myapps.created-banner}">应用注册成功</p>
          <p><span th:text="#{jauth.myapps.col-client-id}">Client ID</span>: <code id="client-id-value"></code></p>
          <p id="secret-row" hidden="hidden">
            <span th:text="#{jauth.myapps.secret-once}">client_secret 只显示这一次</span>
            <code id="secret-value"></code>
          </p>
          <p><a th:href="@{/selfservice/my-apps}" th:text="#{jauth.myapps.view-list}">查看我的应用</a></p>
        </div>

        <form class="form" id="my-app-form">
          <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}" />
          <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}" />
          <label class="field">
            <span th:text="#{jauth.myapps.field-name}">应用名</span>
            <input type="text" name="name" maxlength="100" required="required" />
          </label>
          <label class="field">
            <span th:text="#{jauth.myapps.field-redirects}">回调地址</span>
            <textarea name="redirectUris" required="required"
                      th:placeholder="'https://app.example.com/callback'"></textarea>
            <span class="hint" th:text="#{jauth.myapps.redirects-hint}">精确 URL，每行一个</span>
          </label>
          <label class="field">
            <span th:text="#{jauth.myapps.field-type}">客户端类型</span>
            <select name="confidential">
              <option value="public" selected="selected" th:text="#{jauth.myapps.type-public-desc}">公开</option>
              <option value="confidential" th:text="#{jauth.myapps.type-confidential-desc}">机密</option>
            </select>
          </label>
          <button class="btn primary" type="submit" th:text="#{jauth.myapps.create-submit}">注册应用</button>
        </form>
      </th:block>
    </main>
  </div>
  <script th:if="${appsSupported}" th:inline="javascript">
    (function () {
      var csrfMeta = document.querySelector('meta[name="_csrf"]');
      var csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
      var form = document.getElementById('my-app-form');
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var confidential = form.querySelector('select[name="confidential"]').value === 'confidential';
        var headers = { 'Content-Type': 'application/json' };
        if (csrfMeta && csrfHeaderMeta) { headers[csrfHeaderMeta.content] = csrfMeta.content; }
        fetch(/*[[ @{/selfservice/my-apps} ]]*/ '/selfservice/my-apps', {
            method: 'POST', headers: headers, credentials: 'same-origin',
            body: JSON.stringify({
              name: form.querySelector('input[name="name"]').value.trim(),
              redirectUris: form.querySelector('textarea[name="redirectUris"]').value,
              confidential: confidential
            })
          })
          .then(function (response) { return response.json(); })
          .then(function (body) {
            if (body.code !== '00000') { window.alert(body.message); return; }
            document.getElementById('client-id-value').textContent = body.data.clientId;
            if (body.data.clientSecret) {
              document.getElementById('secret-value').textContent = body.data.clientSecret;
              document.getElementById('secret-row').hidden = false;
            }
            document.getElementById('secret-banner').hidden = false;
            form.hidden = true;
          });
      });
    })();
  </script>
</body>
</html>
