<!DOCTYPE html>
<!--/* 我的组织页（B11：org 自助创建）:归属列表(名称/角色徽标,OWNER 行带审批与 org 应用入口) + 新建组织表单(JS → JSON) */-->
<html lang="zh" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('jauth.myorgs.title')}">
  <title>我的组织</title>
</head>
<body>
  <!--/* 自助页补充样式（ss- 前缀自成命名空间，照 my-apps 同款） */-->
  <style>
    .ss-wide { max-width: 760px; }
    .ss-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .ss-table th, .ss-table td { border-bottom: 1px solid #dfe3ef; padding: 8px 10px; text-align: left; }
    .ss-table th { color: #5a607a; font-weight: 600; }
    .ss-badge { display: inline-block; margin-left: 6px; border-radius: 6px; padding: 1px 8px;
                font-size: 12px; background: #eef2fd; color: #3352a4; }
    .ss-badge.owner { background: #eefaf0; color: #1f7a3d; }
    .ss-actions a { margin-right: 12px; }
    .card h2 { margin: 20px 0 12px; font-size: 17px; }
  </style>
  <div class="page">
    <main class="card ss-wide">
      <p class="brand" th:text="#{jauth.brand}">jauth-hub</p>
      <h1 th:text="#{jauth.myorgs.title}">我的组织</h1>
      <details class="teach" th:if="${educational}">
        <summary th:text="#{jauth.teach.what-happened}">发生了什么</summary>
        <p th:text="#{jauth.myorgs.teach}">我的组织教学说明</p>
      </details>

      <div class="alert" th:if="${!orgsSupported}" th:text="#{jauth.myorgs.unsupported}">当前装配不支持</div>

      <th:block th:if="${orgsSupported}">
        <form class="form" id="org-create-form">
          <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}" />
          <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}" />
          <label class="field">
            <span th:text="#{jauth.myorgs.field-name}">组织名</span>
            <input type="text" name="name" maxlength="50" required="required"
                   th:placeholder="#{jauth.myorgs.name-placeholder}" />
          </label>
          <button class="btn primary" type="submit" th:text="#{jauth.myorgs.create-submit}">新建组织</button>
        </form>

        <h2 th:text="#{jauth.myorgs.list-title}">我的组织</h2>
        <p class="hint" th:if="${#lists.isEmpty(orgs)}" th:text="#{jauth.myorgs.empty}">还没有组织</p>
        <table class="ss-table" th:if="${!#lists.isEmpty(orgs)}">
          <thead>
            <tr>
              <th th:text="#{jauth.myorgs.col-name}">组织名</th>
              <th th:text="#{jauth.myorgs.col-role}">我的角色</th>
              <th th:text="#{jauth.myorgs.col-actions}">管理</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="membership : ${orgs}">
              <td class="scope-name" th:text="${membership.orgName}">acme</td>
              <td>
                <span class="ss-badge" th:classappend="${membership.role.name() == 'OWNER'} ? owner"
                      th:text="${membership.role.name() == 'OWNER'} ? #{jauth.myorgs.role-owner} : #{jauth.myorgs.role-member}">OWNER</span>
              </td>
              <td class="ss-actions">
                <!--/* 入口控制：审批权与 org 应用注册权都在 OWNER，MEMBER 不渲染入口（越权访问由服务层 A0508 兜底） */-->
                <th:block th:if="${membership.role.name() == 'OWNER'}">
                  <a th:href="@{/selfservice/orgs/{orgId}/installations(orgId=${membership.orgId})}"
                     th:text="#{jauth.myorgs.link-installations}">安装审批</a>
                  <a th:href="@{/selfservice/orgs/{orgId}/apps(orgId=${membership.orgId})}"
                     th:text="#{jauth.myorgs.link-apps}">组织应用</a>
                  <a th:href="@{/selfservice/orgs/{orgId}/members(orgId=${membership.orgId})}"
                     th:text="#{jauth.myorgs.link-members}">成员管理</a>
                </th:block>
              </td>
            </tr>
          </tbody>
        </table>
      </th:block>
    </main>
  </div>
  <script th:if="${orgsSupported}" th:inline="javascript">
    (function () {
      var csrfMeta = document.querySelector('meta[name="_csrf"]');
      var csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
      var form = document.getElementById('org-create-form');
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var headers = { 'Content-Type': 'application/json' };
        if (csrfMeta && csrfHeaderMeta) { headers[csrfHeaderMeta.content] = csrfMeta.content; }
        fetch(/*[[ @{/selfservice/my-orgs} ]]*/ '/selfservice/my-orgs', {
            method: 'POST', headers: headers, credentials: 'same-origin',
            body: JSON.stringify({ name: form.querySelector('input[name="name"]').value.trim() })
          })
          .then(function (response) { return response.json(); })
          .then(function (body) {
            if (body.code !== '00000') { window.alert(body.message); return; }
            window.location.reload();
          });
      });
    })();
  </script>
</body>
</html>
