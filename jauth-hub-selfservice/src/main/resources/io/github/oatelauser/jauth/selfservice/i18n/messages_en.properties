# Passkey management page (v1.2 C2: register/list/delete, page drives the framework WebAuthn endpoints)
jauth.passkey.title=Passkeys
jauth.passkey.teach=A passkey replaces your password with device-local biometrics: the private key never leaves your device, the server verifies a local signature over a fresh challenge — nothing phishable to steal. Each key can be deleted individually.
jauth.passkey.create-title=Add a passkey
jauth.passkey.label=Name
jauth.passkey.label-placeholder=e.g. My phone
jauth.passkey.create-submit=Add
jauth.passkey.list-title=My passkeys
jauth.passkey.col-label=Name
jauth.passkey.col-credential-id=Credential ID
jauth.passkey.col-created=Added
jauth.passkey.col-last-used=Last used
jauth.passkey.delete=Delete
jauth.passkey.delete-confirm=Delete this passkey? The device will no longer sign in without a password.
jauth.passkey.empty=No passkeys yet
jauth.passkey.unnamed=Unnamed
jauth.passkey.unsupported=Passkeys are disabled: set jauth-hub.passkey.enabled=true (rp-id/allowed-origins default to the issuer-derived values) to enable.
jauth.passkey.error=Registration did not complete, please try again

