<!DOCTYPE html>
<!--/* sudo 验证页（v1.2 C3）：敏感操作被 A0515 拦下后的 passkey 就地升权——断言走 /login/webauthn（内联 JS 带 CSRF），成功跳 returnTo（服务端已校验本站路径） */-->
<html lang="zh" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('jauth.sudo.title')}">
  <title>强验证</title>
</head>
<body>
  <div class="page">
    <main class="card ss-wide">
      <p class="brand" th:text="#{jauth.brand}">jauth-hub</p>
      <h1 th:text="#{jauth.sudo.title}">强验证</h1>
      <details class="teach" th:if="${educational}">
        <summary th:text="#{jauth.teach.what-happened}">发生了什么</summary>
        <p th:text="#{jauth.sudo.teach}">强验证教学说明</p>
      </details>

      <div class="alert" th:if="${!sudoEnabled}" th:text="#{jauth.sudo.unsupported}">强验证未启用</div>

      <th:block th:if="${sudoEnabled}">
        <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}" />
        <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}" />

        <p th:text="#{jauth.sudo.intro}">该操作需要先确认是你本人。</p>
        <div class="alert" id="sudo-error" hidden="hidden" role="alert" th:text="#{jauth.sudo.error}">验证未通过，请重试</div>
        <button class="btn primary" type="button" id="sudo-verify" th:text="#{jauth.sudo.verify}">使用通行密钥验证</button>
        <p class="hint"><a th:href="${returnTo}" th:text="#{jauth.sudo.back}">暂不验证，返回</a></p>
      </th:block>
    </main>
  </div>
  <script th:if="${sudoEnabled}" th:inline="javascript">
    (function () {
      var returnTo = /*[[${returnTo}]]*/ '/selfservice/apps';
      var csrfMeta = document.querySelector('meta[name="_csrf"]');
      var csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
      function postHeaders() {
        var headers = { 'Content-Type': 'application/json' };
        if (csrfMeta && csrfHeaderMeta) { headers[csrfHeaderMeta.content] = csrfMeta.content; }
        return headers;
      }
      /* base64url（无 padding，对齐 SS7 Bytes 序列化）↔ ArrayBuffer：WebAuthn 二进制字段的 JSON 线格式 */
      function toArrayBuffer(value) {
        var binary = window.atob(value.replace(/-/g, '+').replace(/_/g, '/'));
        var bytes = new Uint8Array(binary.length);
        for (var i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); }
        return bytes.buffer;
      }
      function toBase64Url(buffer) {
        var bytes = new Uint8Array(buffer);
        var binary = '';
        for (var i = 0; i < bytes.length; i++) { binary += String.fromCharCode(bytes[i]); }
        return window.btoa(binary).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }
      var errorBox = document.getElementById('sudo-error');
      function showError() { errorBox.hidden = false; }
      /* 选项端点把 challenge 存进 session，/login/webauthn 断言回传时按 session 配对——每次尝试都取新 options */
      function requestOptions() {
        return fetch(/*[[ @{/webauthn/authenticate/options} ]]*/ '/webauthn/authenticate/options',
            { method: 'POST', headers: postHeaders(), credentials: 'same-origin' })
          .then(function (response) {
            if (!response.ok) { throw new Error('options ' + response.status); }
            return response.json();
          });
      }
      function assertWithAuthenticator(options) {
        var publicKey = {
          challenge: toArrayBuffer(options.challenge),
          rpId: options.rpId,
          timeout: options.timeout,
          userVerification: options.userVerification,
          allowCredentials: (options.allowCredentials || []).map(function (descriptor) {
            return { type: descriptor.type, id: toArrayBuffer(descriptor.id) };
          })
        };
        return navigator.credentials.get({ publicKey: publicKey });
      }
      function postAssertion(credential) {
        return fetch(/*[[ @{/login/webauthn} ]]*/ '/login/webauthn',
            { method: 'POST', headers: postHeaders(), credentials: 'same-origin',
              body: JSON.stringify({
                id: credential.id,
                rawId: toBase64Url(credential.rawId),
                type: credential.type,
                response: {
                  clientDataJSON: toBase64Url(credential.response.clientDataJSON),
                  authenticatorData: toBase64Url(credential.response.authenticatorData),
                  signature: toBase64Url(credential.response.signature),
                  userHandle: credential.response.userHandle ? toBase64Url(credential.response.userHandle) : null
                },
                clientExtensionResults: {},
                authenticatorAttachment: credential.authenticatorAttachment
              }) })
          .then(function (response) {
            if (!response.ok) { throw new Error('login ' + response.status); }
            return response.json();
          });
      }
      document.getElementById('sudo-verify').addEventListener('click', function () {
        errorBox.hidden = true;
        if (!window.PublicKeyCredential) { errorBox.textContent = /*[[#{jauth.sudo.unsupported-browser}]]*/ '当前浏览器不支持通行密钥'; showError(); return; }
        /* 断言成功即 strong_auth_at 打点（服务器侧桥）；redirectUrl 是框架默认登录后页，无视——回 returnTo。
           任一步失败（含凭据已删致旧 options 的 allowCredentials 失效）→ 提示；重点重走取新 options 全流程 */
        requestOptions()
          .then(assertWithAuthenticator)
          .then(postAssertion)
          .then(function () { window.location.href = returnTo; })
          .catch(showError);
      });
    })();
  </script>
</body>
</html>
