<!DOCTYPE html>
<!--/* 已授权应用看板（05 票 v1.0）：授权持久化与撤销语义；"解除授权"走 JSON 端点（授权 + consent 双清） */-->
<html lang="zh" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('jauth.apps.title')}">
  <title>已授权应用</title>
</head>
<body>
  <!--/* 自助页补充样式（ss- 前缀自成命名空间）：core 单文件 CSS 属 core 模块不可改，列表样式在本页就地补齐 */-->
  <style>
    .ss-wide { max-width: 760px; }
    .ss-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .ss-table th, .ss-table td { border-bottom: 1px solid #dfe3ef; padding: 8px 10px; text-align: left; }
    .ss-table th { color: #5a607a; font-weight: 600; }
    .card h2 { margin: 20px 0 12px; font-size: 17px; }
  </style>
  <div class="page">
    <main class="card ss-wide">
      <p class="brand" th:text="#{jauth.brand}">jauth-hub</p>
      <h1 th:text="#{jauth.apps.title}">已授权应用</h1>
      <details class="teach" th:if="${educational}">
        <summary th:text="#{jauth.teach.what-happened}">发生了什么</summary>
        <p th:text="#{jauth.apps.teach}">看板教学说明</p>
      </details>

      <!--/* 通行密钥导航入口（v1.2 C2）：passkey 开启才渲染——默认关看板零可见变化 */-->
      <p class="hint" th:if="${passkeyEnabled}">
        <a th:href="@{/selfservice/passkey}" th:text="#{jauth.apps.passkey-link}">通行密钥</a>
      </p>

      <div class="alert" th:if="${!appsSupported}" th:text="#{jauth.apps.unsupported}">当前存储模式不支持</div>

      <th:block th:if="${appsSupported}">
        <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}" />
        <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}" />
        <p class="hint" th:if="${#lists.isEmpty(apps)}" th:text="#{jauth.apps.empty}">还没有授权任何应用</p>
        <table class="ss-table" th:if="${!#lists.isEmpty(apps)}">
          <thead>
            <tr>
              <th th:text="#{jauth.apps.col-app}">应用</th>
              <th th:text="#{jauth.apps.col-scopes}">授权范围</th>
              <th th:text="#{jauth.apps.col-authorized-at}">最近授权时间</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="app : ${apps}">
              <td th:text="${app.clientName}">演示应用</td>
              <td th:text="${#strings.listJoin(app.scopes, ' ')}">openid profile</td>
              <td th:text="${app.lastAuthorizedAt == null} ? '—' : ${#temporals.format(app.lastAuthorizedAt, 'yyyy-MM-dd HH:mm')}">2026-09-29 10:00</td>
              <td>
                <button class="btn ss-revoke" type="button"
                        th:attr="data-revoke-url=@{'/selfservice/apps/' + ${app.clientId} + '/revoke'}"
                        th:text="#{jauth.apps.revoke}">解除授权</button>
              </td>
            </tr>
          </tbody>
        </table>
      </th:block>
    </main>
  </div>
  <script th:if="${appsSupported}" th:inline="javascript">
    (function () {
      var csrfMeta = document.querySelector('meta[name="_csrf"]');
      var csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
      Array.prototype.forEach.call(document.querySelectorAll('.ss-revoke'), function (button) {
        button.addEventListener('click', function () {
          var headers = {};
          if (csrfMeta && csrfHeaderMeta) { headers[csrfHeaderMeta.content] = csrfMeta.content; }
          fetch(button.getAttribute('data-revoke-url'),
              { method: 'POST', headers: headers, credentials: 'same-origin' })
            .then(function (response) { return response.json(); })
            .then(function (body) {
              if (body.code !== '00000') { window.alert(body.message); return; }
              button.closest('tr').remove();
            });
        });
      });
    })();
  </script>
</body>
</html>
