<!DOCTYPE html>
<!--/* 我的应用列表页（B10：个人应用免安装审批）:应用行(名称/Client ID/类型/回调/创建时间) + 注册入口;secret 永不回显 */-->
<html lang="zh" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('jauth.myapps.title')}">
  <title>我的应用</title>
</head>
<body>
  <!--/* 自助页补充样式（ss- 前缀自成命名空间）：core 单文件 CSS 属 core 模块不可改，列表样式在本页就地补齐 */-->
  <style>
    .ss-wide { max-width: 760px; }
    .ss-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .ss-table th, .ss-table td { border-bottom: 1px solid #dfe3ef; padding: 8px 10px; text-align: left; }
    .ss-table th { color: #5a607a; font-weight: 600; }
    .ss-mono { font-family: ui-monospace, Consolas, monospace; font-size: 13px; word-break: break-all; }
    .ss-badge { display: inline-block; margin-left: 6px; border-radius: 6px; padding: 1px 8px;
                font-size: 12px; background: #eef2fd; color: #3352a4; }
    .ss-badge.confidential { background: #fdeef1; color: #b02a37; }
    .ss-actions button { margin-right: 6px; padding: 3px 10px; font-size: 13px; cursor: pointer; }
    .ss-actions button.danger { color: #b02a37; }
    .card h2 { margin: 20px 0 12px; font-size: 17px; }
    .ss-secret-banner { border: 1px solid #c9b458; background: #fdf8e3; padding: 10px 12px;
                        margin: 12px 0; font-size: 13px; word-break: break-all; }
  </style>
  <!--/* 管理动作 fetch 的 CSRF 头来源（apps.html 同款） */-->
  <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}" />
  <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}" />
  <div class="page">
    <main class="card ss-wide">
      <p class="brand" th:text="#{jauth.brand}">jauth-hub</p>
      <h1 th:text="#{jauth.myapps.title}">我的应用</h1>
      <details class="teach" th:if="${educational}">
        <summary th:text="#{jauth.teach.what-happened}">发生了什么</summary>
        <p th:text="#{jauth.myapps.teach}">我的应用教学说明</p>
      </details>

      <div class="alert" th:if="${!appsSupported}" th:text="#{jauth.myapps.unsupported}">当前装配不支持</div>

      <th:block th:if="${appsSupported}">
        <div class="ss-secret-banner" id="secret-banner" style="display: none">
          <p id="secret-banner-text"></p>
        </div>
        <p>
          <a class="btn primary" th:href="@{/selfservice/my-apps/new}" th:text="#{jauth.myapps.new-link}">注册新应用</a>
        </p>
        <p class="hint" th:if="${#lists.isEmpty(apps)}" th:text="#{jauth.myapps.empty}">还没有应用</p>
        <table class="ss-table" th:if="${!#lists.isEmpty(apps)}">
          <thead>
            <tr>
              <th th:text="#{jauth.myapps.col-name}">应用名</th>
              <th th:text="#{jauth.myapps.col-client-id}">Client ID</th>
              <th th:text="#{jauth.myapps.col-type}">类型</th>
              <th th:text="#{jauth.myapps.col-redirects}">回调地址</th>
              <th th:text="#{jauth.myapps.col-created}">创建时间</th>
              <th th:text="#{jauth.myapps.col-actions}">管理</th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="app : ${apps}" th:attr="data-app-id=${app.id}">
              <td class="scope-name" th:text="${app.name}">我的应用</td>
              <td class="ss-mono" th:text="${app.clientId}">app_xxxxxxxx</td>
              <td>
                <span class="ss-badge" th:classappend="${app.confidential} ? confidential"
                      th:text="${app.confidential} ? #{jauth.myapps.type-confidential} : #{jauth.myapps.type-public}">类型</span>
              </td>
              <td class="ss-mono" th:text="${#strings.listJoin(app.redirectUris, ' ')}">https://app.example.com/callback</td>
              <td th:text="${#temporals.format(app.createdAt, 'yyyy-MM-dd HH:mm')}">2026-09-30 10:00</td>
              <td class="ss-actions">
                <button type="button" class="rotate" th:if="${app.confidential}"
                        th:text="#{jauth.myapps.rotate}">轮转密钥</button>
                <button type="button" class="edit" th:text="#{jauth.myapps.edit}">编辑</button>
                <button type="button" class="danger delete" th:text="#{jauth.myapps.delete}">删除</button>
              </td>
            </tr>
          </tbody>
        </table>
      </th:block>
    </main>
  </div>
  <!--/* 管理动作（v1.3 D2）：轮转/编辑/删除;A0515 = sudo 过期,跳验证页带 returnTo(C3 页面同款语义);
      轮转/删除的确认与新明文一次性横幅都在本页就地完成,零外链零依赖 */-->
  <script th:inline="javascript">
    (function () {
      var banner = document.getElementById('secret-banner');
      var bannerText = document.getElementById('secret-banner-text');
      var csrfMeta = document.querySelector('meta[name="_csrf"]');
      var csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');

      function call(method, url, body) {
        var headers = { 'Accept': 'application/json' };
        if (csrfMeta && csrfHeaderMeta) { headers[csrfHeaderMeta.content] = csrfMeta.content; }
        return fetch(url, {
          method: method,
          headers: headers,
          credentials: 'same-origin',
          body: body ? JSON.stringify(body) : undefined
        }).then(function (response) {
          return response.json().then(function (payload) { return { ok: response.ok, payload: payload }; });
        });
      }

      function handleResult(result, onCode) {
        if (result.ok) { onCode(result.payload); return; }
        if (result.payload && result.payload.code === 'A0515') {
          window.location.href = '/selfservice/sudo?returnTo=' + encodeURIComponent(window.location.pathname);
          return;
        }
        alert((result.payload && result.payload.message) || '操作失败');
      }

      document.querySelectorAll('tr[data-app-id]').forEach(function (row) {
        var appId = row.getAttribute('data-app-id');

        var rotateButton = row.querySelector('button.rotate');
        if (rotateButton) {
          rotateButton.addEventListener('click', function () {
            call('POST', '/selfservice/my-apps/' + appId + '/secret').then(function (result) {
              handleResult(result, function (payload) {
                banner.style.display = 'block';
                bannerText.textContent = payload.data.clientSecret;
              });
            });
          });
        }

        row.querySelector('button.edit').addEventListener('click', function () {
          var name = prompt('新应用名', '');
          if (name === null) { return; }
          var redirects = prompt('回调地址(每行一个,精确匹配)', '');
          if (redirects === null) { return; }
          call('POST', '/selfservice/my-apps/' + appId, { name: name, redirectUris: redirects })
            .then(function (result) { handleResult(result, function () { window.location.reload(); }); });
        });

        row.querySelector('button.delete').addEventListener('click', function () {
          if (!window.confirm('确认删除该应用?其全部授权与安装将一并失效,不可恢复。')) { return; }
          call('DELETE', '/selfservice/my-apps/' + appId)
            .then(function (result) { handleResult(result, function () { window.location.reload(); }); });
        });
      });
    })();
  </script>
</body>
</html>
