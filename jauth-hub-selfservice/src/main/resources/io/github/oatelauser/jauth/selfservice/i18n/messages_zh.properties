jauth.orginst.field-scopes=请求范围
jauth.orginst.request-submit=发起安装请求

# 组织应用（B11：org 应用注册/列表，OWNER 面）
jauth.orgapps.title=组织应用
jauth.orgapps.teach=组织应用归组织所有（区别于"我的应用"归个人）：注册拿到 client_id（机密应用另有 client_secret，只显示这一次）。组织应用对本组织成员发放令牌前需先完成安装审批——scope 封顶由审批时的勾选决定，不在注册时设定。
