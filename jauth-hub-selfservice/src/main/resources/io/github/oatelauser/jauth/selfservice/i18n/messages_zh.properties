jauth.orginst.all-empty=还没有安装
jauth.orginst.col-client=应用
jauth.orginst.col-status=状态
jauth.orginst.col-ceiling=封顶范围
jauth.orginst.col-requester=发起人
jauth.orginst.col-approver=审批人/时间
jauth.orginst.col-created=发起时间
jauth.orginst.status-pending=待批
