# sudo 验证页（v1.2 C3：敏感操作被 A0515 拦下后的 passkey 就地升权）
jauth.sudo.title=强验证
jauth.sudo.teach=刚才的操作比较敏感（如改密码、改角色），需要确认最近一次通行密钥验证仍有效：登录密码可能早已泄露，而通行密钥的私钥不出设备、无法被钓鱼。验证一次后的一段时间内（默认 15 分钟）同类操作不再重复验证；过期后再触达敏感操作会再次来到本页，原表单需要重新填写提交。
jauth.sudo.intro=该操作需要先确认是你本人：使用通行密钥完成一次验证。
jauth.sudo.verify=使用通行密钥验证
jauth.sudo.error=验证未通过，请重试
jauth.sudo.unsupported-browser=当前浏览器不支持通行密钥
jauth.sudo.back=暂不验证，返回
jauth.sudo.unsupported=强验证（sudo）未启用：默认关闭，需以 jauth-hub.sudo.enabled=true 且 jauth-hub.passkey.enabled=true 部署后使用。
