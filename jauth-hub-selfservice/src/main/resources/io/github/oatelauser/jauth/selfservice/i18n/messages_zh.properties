# jauth-hub 自助模块页面中文文案（主填，SPEC §1：UI 中文单语 + i18n 资源结构；模块自有 namespace，core 键经 parent 链解析）

# PAT 管理页（05 票：不走浏览器的另一种令牌发放路径）
jauth.pat.title=个人访问令牌
jauth.pat.teach=个人访问令牌（PAT）是不走浏览器的另一种令牌发放路径：你在脚本或命令行里直接持有它调用 API。创建后明文只显示这一次，服务端只保存它的 SHA-256 哈希与展示前缀——与访问令牌一致的"落库即哈希"纪律，数据库被拖走也推不回明文。
jauth.pat.create-title=创建令牌
jauth.pat.name=名称
jauth.pat.name-placeholder=例如：CI 部署脚本
jauth.pat.unnamed=未命名
jauth.pat.scopes=授权范围
jauth.pat.validity=有效期
jauth.pat.validity-30=30 天
jauth.pat.validity-90=90 天
jauth.pat.validity-365=365 天
jauth.pat.create-submit=生成令牌
jauth.pat.token-once=请立即保存：明文令牌只显示这一次，离开本页后无法再次查看
jauth.pat.list-title=我的令牌
jauth.pat.col-name=名称
jauth.pat.col-prefix=前缀
jauth.pat.col-scopes=范围
jauth.pat.col-created=创建时间
jauth.pat.col-expires=过期时间
jauth.pat.col-last-used=最近使用
jauth.pat.expired=已过期
jauth.pat.revoke=吊销
jauth.pat.empty=还没有令牌
jauth.pat.unsupported=当前存储模式（memory）不支持个人访问令牌：PAT 是持久化凭据，请以 jauth-hub.storage=jdbc 部署后再使用。

# 已授权应用看板（05 票：授权的持久化与撤销语义）
jauth.apps.title=已授权应用
jauth.apps.teach=下方列表是认证中心持久化保存的授权记录（按应用聚合）。"解除授权"会同时删除该应用持有的令牌与你的授权许可（consent）——下次使用需重新登录并重新确认授权，两步缺一不可：只删令牌不删 consent 的话，下次授权会跳过确认页。
jauth.apps.col-app=应用
jauth.apps.col-scopes=授权范围
jauth.apps.col-authorized-at=最近授权时间
jauth.apps.revoke=解除授权
jauth.apps.empty=还没有授权任何应用
jauth.apps.unsupported=当前存储模式（memory）不支持授权看板查询：授权记录的按用户枚举需要数据库查询面，请以 jauth-hub.storage=jdbc 部署后再使用。
jauth.apps.passkey-link=通行密钥

# 通行密钥管理页（v1.2 C2：注册/列表/删除，页面走框架 WebAuthn 端点）
jauth.passkey.title=通行密钥
jauth.passkey.teach=通行密钥（passkey）用设备上的生物识别（指纹/面容/PIN）替代密码登录：私钥生成后永不出设备，登录时服务器下发挑战、设备本地签名回传验签——没有可被钓鱼或撞库的密码。在此注册的每把密钥可单独删除，删除后旧登录会话不受影响，但该设备无法再免密登录。
jauth.passkey.create-title=添加通行密钥
jauth.passkey.label=名称
jauth.passkey.label-placeholder=例如：我的手机
jauth.passkey.create-submit=添加
jauth.passkey.list-title=我的通行密钥
jauth.passkey.col-label=名称
jauth.passkey.col-credential-id=凭据 ID
jauth.passkey.col-created=添加时间
jauth.passkey.col-last-used=最近使用
jauth.passkey.delete=删除
jauth.passkey.delete-confirm=确定删除该通行密钥吗？删除后该设备将无法再免密登录。
jauth.passkey.empty=还没有通行密钥
jauth.passkey.unnamed=未命名
jauth.passkey.unsupported=通行密钥未启用：默认关闭，需以 jauth-hub.passkey.enabled=true 部署（rp-id/allowed-origins 缺省由 issuer 推导）后再使用。
jauth.passkey.error=注册未完成，请重试

# 我的应用（B10：个人应用免安装审批自助注册）
jauth.myapps.title=我的应用
jauth.myapps.teach=在这里注册你自己的应用（OAuth 客户端）：注册后拿到 client_id（机密应用另有 client_secret，只显示这一次），把回调地址配进你的应用即可发起授权码 + PKCE 流程。个人应用无需审批，可申请的 scope 由授权确认页把关。
jauth.myapps.new-link=注册新应用
jauth.myapps.empty=还没有应用
jauth.myapps.col-name=应用名
jauth.myapps.col-client-id=Client ID
jauth.myapps.col-type=类型
jauth.myapps.col-redirects=回调地址
jauth.myapps.col-created=创建时间
jauth.myapps.type-confidential=机密
jauth.myapps.type-public=公开
jauth.myapps.unsupported=当前装配不支持应用自助注册（需 jauth 存储装配在位）。
jauth.myapps.new-title=注册新应用
jauth.myapps.field-name=应用名
jauth.myapps.field-redirects=回调地址（Redirect URIs，每行一个）
jauth.myapps.field-type=客户端类型
jauth.myapps.type-public-desc=公开（public）：浏览器 / 移动端 / 无法保密的场景，无 client_secret，不发 refresh token
jauth.myapps.type-confidential-desc=机密（confidential）：运行在服务器端，持有 client_secret，可使用 refresh token
jauth.myapps.redirects-hint=精确 URL，每行一个；授权时与回调地址精确匹配（不支持通配）
jauth.myapps.create-submit=注册应用
jauth.myapps.secret-once=请立即保存：client_secret 只显示这一次，离开本页后无法再次查看
jauth.myapps.created-banner=应用注册成功
jauth.myapps.view-list=查看我的应用

# 我的组织（B11：org 自助创建，创建者自动 OWNER）
jauth.myorgs.title=我的组织
jauth.myorgs.teach=组织是权限边界：创建组织后你自动成为 OWNER——组织应用的安装审批权（批准时可收窄 scope 封顶）与组织应用注册权都归 OWNER。组织名全局唯一；普通成员（MEMBER）只是归属关系，不持审批权。
jauth.myorgs.unsupported=当前装配不支持组织自助管理（需 jauth 域服务在位）。
jauth.myorgs.field-name=组织名
jauth.myorgs.name-placeholder=例如：研发一部
jauth.myorgs.create-submit=新建组织
jauth.myorgs.list-title=我的组织
jauth.myorgs.empty=还没有组织
jauth.myorgs.col-name=组织名
jauth.myorgs.col-role=我的角色
jauth.myorgs.col-actions=管理
jauth.myorgs.role-owner=OWNER
jauth.myorgs.role-member=MEMBER
jauth.myorgs.link-installations=安装审批
jauth.myorgs.link-apps=组织应用

# 安装审批（B11：流向 A 两步制的 OWNER 面）
jauth.orginst.title=安装审批
jauth.orginst.teach=安装 = 应用 × 组织 的授权关系，两步制：任何登录用户发起请求（待批）→ 组织 OWNER 审批。批准时勾选的范围成为该组织使用此应用的封顶（ceiling）；最终发放的访问令牌范围 = 请求 ∩ 用户确认（consent） ∩ 封顶，三道取交由服务端强制，任何一方收窄都立即生效。
jauth.orginst.unsupported=当前装配不支持安装审批（需 jauth 域服务在位）。
jauth.orginst.pending-title=待批请求
jauth.orginst.pending-empty=没有待批请求
jauth.orginst.requested-scopes=请求范围
jauth.orginst.approve=批准
jauth.orginst.reject=驳回
