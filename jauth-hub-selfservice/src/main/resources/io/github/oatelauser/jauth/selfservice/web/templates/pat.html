<!DOCTYPE html>
<!--/* PAT 管理页（05 票 v1.0）：教学块 + 创建表单（scope 勾选/有效期阶梯）+ 列表；创建/吊销走 JSON 端点（少量原生 JS） */-->
<html lang="zh" xmlns:th="https://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('jauth.pat.title')}">
  <title>个人访问令牌</title>
</head>
<body>
  <!--/* 自助页补充样式（ss- 前缀自成命名空间）：core 单文件 CSS 属 core 模块不可改，列表/徽标/横幅在本页就地补齐 */-->
  <style>
    .ss-wide { max-width: 760px; }
    .ss-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .ss-table th, .ss-table td { border-bottom: 1px solid #dfe3ef; padding: 8px 10px; text-align: left; }
    .ss-table th { color: #5a607a; font-weight: 600; }
    .ss-badge { display: inline-block; margin-left: 6px; border-radius: 6px; padding: 1px 8px;
                font-size: 12px; background: #fdeef1; color: #b02a37; }
    .ss-token-banner code { display: block; margin-top: 6px; word-break: break-all;
                            font-family: ui-monospace, Consolas, monospace; font-size: 14px; }
    .field select { border: 1px solid #dfe3ef; border-radius: 8px; padding: 10px 12px; font-size: 15px; }
    .card h2 { margin: 20px 0 12px; font-size: 17px; }
  </style>
  <div class="page">
    <main class="card ss-wide">
      <p class="brand" th:text="#{jauth.brand}">jauth-hub</p>
      <h1 th:text="#{jauth.pat.title}">个人访问令牌</h1>
      <details class="teach" th:if="${educational}">
        <summary th:text="#{jauth.teach.what-happened}">发生了什么</summary>
        <p th:text="#{jauth.pat.teach}">PAT 教学说明</p>
      </details>

      <div class="alert" th:if="${!patSupported}" th:text="#{jauth.pat.unsupported}">当前存储模式不支持</div>

      <th:block th:if="${patSupported}">
        <!--/* 明文令牌唯一出现位：创建成功后由脚本填入，刷新即失 */-->
        <div class="alert ss-token-banner" id="token-banner" hidden="hidden">
          <p th:text="#{jauth.pat.token-once}">请立即保存：明文令牌只显示这一次</p>
          <code id="token-value"></code>
        </div>

        <h2 th:text="#{jauth.pat.create-title}">创建令牌</h2>
        <form class="form" id="pat-form" th:action="@{/selfservice/pat}" method="post">
          <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}" />
          <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}" />
          <label class="field">
            <span th:text="#{jauth.pat.name}">名称</span>
            <input type="text" name="name" maxlength="100" required="required"
                   th:placeholder="#{jauth.pat.name-placeholder}" />
          </label>
          <p class="scopes-label" th:text="#{jauth.pat.scopes}">授权范围</p>
          <ul class="scopes">
            <li class="scope-item" th:each="scope : ${scopes}">
              <input type="checkbox" name="scope" th:value="${scope.name}" th:id="'scope-' + ${scope.name}" />
              <label class="scope-name" th:for="'scope-' + ${scope.name}" th:text="${scope.name}">scope</label>
              <span class="scope-desc" th:text="${scope.description}">描述</span>
            </li>
          </ul>
          <label class="field">
            <span th:text="#{jauth.pat.validity}">有效期</span>
            <select name="validityDays">
              <option th:each="days : ${validityDays}" th:value="${days}"
                      th:selected="${days == defaultValidityDays}"
                      th:text="#{'jauth.pat.validity-' + ${days}}">90 天</option>
            </select>
          </label>
          <button class="btn primary" type="submit" th:text="#{jauth.pat.create-submit}">生成令牌</button>
        </form>

        <h2 th:text="#{jauth.pat.list-title}">我的令牌</h2>
        <p class="hint" th:if="${#lists.isEmpty(pats)}" th:text="#{jauth.pat.empty}">还没有令牌</p>
        <table class="ss-table" th:if="${!#lists.isEmpty(pats)}">
          <thead>
            <tr>
              <th th:text="#{jauth.pat.col-name}">名称</th>
              <th th:text="#{jauth.pat.col-prefix}">前缀</th>
              <th th:text="#{jauth.pat.col-scopes}">范围</th>
              <th th:text="#{jauth.pat.col-created}">创建时间</th>
              <th th:text="#{jauth.pat.col-expires}">过期时间</th>
              <th th:text="#{jauth.pat.col-last-used}">最近使用</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr th:each="pat : ${pats}" th:id="'pat-row-' + ${pat.id}">
              <!--/* 存量行（V7 前）name 为 NULL：回退 i18n 未命名，不展示空白单元格 */-->
              <td class="scope-name" th:text="${pat.name == null} ? #{jauth.pat.unnamed} : ${pat.name}">令牌名</td>
              <td class="scope-name" th:text="${pat.tokenPrefix}">jpat_xxxxxxx</td>
              <td th:text="${#strings.setJoin(pat.scopes, ' ')}">openid profile</td>
              <td th:text="${#temporals.format(pat.createdAt, 'yyyy-MM-dd HH:mm')}">2026-09-29 10:00</td>
              <td>
                <span th:text="${#temporals.format(pat.expiresAt, 'yyyy-MM-dd HH:mm')}">2026-12-28 10:00</span>
                <span class="ss-badge" th:if="${pat.expired(now)}" th:text="#{jauth.pat.expired}">已过期</span>
              </td>
              <td th:text="${pat.lastUsedAt == null} ? '—' : ${#temporals.format(pat.lastUsedAt, 'yyyy-MM-dd HH:mm')}">—</td>
              <td>
                <button class="btn ss-revoke" type="button"
                        th:attr="data-revoke-url=@{'/selfservice/pat/' + ${pat.id} + '/revoke'}"
                        th:text="#{jauth.pat.revoke}">吊销</button>
              </td>
            </tr>
          </tbody>
        </table>
      </th:block>
    </main>
  </div>
  <script th:if="${patSupported}" th:inline="javascript">
    (function () {
      var csrfMeta = document.querySelector('meta[name="_csrf"]');
      var csrfHeaderMeta = document.querySelector('meta[name="_csrf_header"]');
      function post(url) {
        var headers = {};
        if (csrfMeta && csrfHeaderMeta) { headers[csrfHeaderMeta.content] = csrfMeta.content; }
        return fetch(url, { method: 'POST', headers: headers, credentials: 'same-origin' })
          .then(function (response) { return response.json(); });
      }
      var form = document.getElementById('pat-form');
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var name = form.querySelector('input[name="name"]').value.trim();
        var scopes = Array.prototype.slice.call(form.querySelectorAll('input[name="scope"]:checked'))
          .map(function (input) { return input.value; });
        var validityDays = Number(form.querySelector('select[name="validityDays"]').value);
        var headers = { 'Content-Type': 'application/json' };
        if (csrfMeta && csrfHeaderMeta) { headers[csrfHeaderMeta.content] = csrfMeta.content; }
        fetch(form.action, { method: 'POST', headers: headers, credentials: 'same-origin',
            body: JSON.stringify({ name: name, scopes: scopes, validityDays: validityDays }) })
          .then(function (response) { return response.json(); })
          .then(function (body) {
            if (body.code !== '00000') { window.alert(body.message); return; }
            document.getElementById('token-value').textContent = body.data.token;
            document.getElementById('token-banner').hidden = false;
          });
      });
      Array.prototype.forEach.call(document.querySelectorAll('.ss-revoke'), function (button) {
        button.addEventListener('click', function () {
          post(button.getAttribute('data-revoke-url')).then(function (body) {
            if (body.code !== '00000') { window.alert(body.message); return; }
            button.closest('tr').remove();
          });
        });
      });
    })();
  </script>
</body>
</html>
